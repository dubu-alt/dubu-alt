# 잔디(기여 그래프)를 뱀이 먹는 애니메이션 SVG를 만들어서 output 브랜치에 올려주는 워크플로
name: generate snake

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 한국시간 자정에 갱신
  workflow_dispatch:       # Actions 탭에서 수동 실행도 가능
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3fb68b
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
